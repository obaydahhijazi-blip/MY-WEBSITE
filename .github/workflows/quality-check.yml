name: Verify website
on:
  push:
    branches: [fix/complete-portfolio-review]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check, lint and production build
        run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_DEMO_CONTENT: "0"
      - name: Smoke test English and Arabic routes
        run: |
          set -eu
          PORT=3100 npm run start >/tmp/obaydah-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:3100/en -o /tmp/en.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/obaydah-next.log; exit 1; fi
          grep -q "Request a project quote" /tmp/en.html
          curl --silent --show-error --fail http://127.0.0.1:3100/ -o /tmp/ar.html
          curl --silent --show-error --fail http://127.0.0.1:3100/en/terms -o /tmp/en-terms.html
          curl --silent --show-error --fail http://127.0.0.1:3100/en/privacy -o /tmp/en-privacy.html
          grep -q "Working Terms" /tmp/en-terms.html
          grep -q "Privacy Policy" /tmp/en-privacy.html
          curl --silent --show-error --fail http://127.0.0.1:3100/opengraph-image -o /tmp/og-image.png
          test "$(wc -c </tmp/og-image.png)" -gt 3000
          grep -q "معاينة رسالة واتساب" /tmp/ar.html
          echo "All public routes respond correctly."
