name: Verify website
on:
  push:
    branches: [main, fix/stabilization-security-tests-20261028]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check, lint and production build
        run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_DEMO_CONTENT: "0"
      - name: Install headless Chromium for interactive QA
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke test published Arabic routes and SEO pages
        run: |
          set -euxo pipefail
          PORT=3100 npm run start >/tmp/obaydah-next.log 2>&1 &
          APP_PID=$!
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then tail -n 80 /tmp/obaydah-next.log || true; fi; kill "$APP_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:3100/ -o /tmp/ar.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/obaydah-next.log; exit 1; fi
          curl --silent --show-error --fail http://127.0.0.1:3100/ -o /tmp/ar.html
          OG_PATH=$(grep -oE "/opengraph-image-[a-zA-Z0-9]+" /tmp/ar.html | head -1)
          test -n "$OG_PATH"
          curl --silent --show-error --fail "http://127.0.0.1:3100$OG_PATH" -o /tmp/og-image.png
          test "$(wc -c </tmp/og-image.png)" -gt 3000
          grep -q "معاينة رسالة واتساب" /tmp/ar.html
          curl --silent --show-error --fail http://127.0.0.1:3100/services/identity -o /tmp/service.html
          grep -q "اطلب عرض سعر" /tmp/service.html
          curl --silent --show-error --fail http://127.0.0.1:3100/sitemap.xml -o /tmp/sitemap.xml
          grep -q "/services/identity" /tmp/sitemap.xml
          curl --silent --show-error --fail http://127.0.0.1:3100/api/site-version -o /tmp/site-version.json
          grep -q "\"commit\"" /tmp/site-version.json
          test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3100/projects/missing-case-study-test)" = "404"
          # English pages must no longer be published.
          test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3100/en)" = "404"
          echo "Arabic pages and sharing preview respond correctly; English removed."
      - name: Browser regression tests (desktop, tablet and mobile)
        env:
          SMOKE_SCREENSHOTS: ${{ runner.temp }}/site-screenshots
        run: |
          set -euo pipefail
          PORT=3100 npm run start >/tmp/obaydah-browser.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -sSf http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-browser.mjs
      - name: Save screenshots if browser QA fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-failure-${{ github.run_number }}
          path: ${{ runner.temp }}/site-screenshots
          if-no-files-found: ignore

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - name: Confirm hosting is serving this exact GitHub commit
        shell: bash
        run: |
          set -euo pipefail
          SITE="${PUBLIC_SITE_URL:-https://sensational-syrniki-faa950.netlify.app}"
          SITE="${SITE%/}"
          for i in $(seq 1 18); do
            if curl -fsS --max-time 12 "$SITE/api/site-version" -o /tmp/site-version.json; then
              if node -e "const d=require('/tmp/site-version.json');process.exit(d.commit===process.env.GITHUB_SHA?0:1)"; then
                echo "Confirmed production deploy: $GITHUB_SHA"
                exit 0
              fi
            fi
            echo "Production is not yet serving the latest commit (attempt $i/18)"
            sleep 25
          done
          echo "::error::Netlify does not serve the newest GitHub commit. Check repository link, build logs, and deploy settings."
          exit 1
